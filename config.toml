# =====================================================================
#  DSM Weekend Getaway Finder - settings
#  Edit this file, commit it, and the next run uses the new values.
# =====================================================================

origin = "DSM"

[trip]
lookahead_days    = 210            # 7-month outlook. Change to 90, 270, etc.
depart_weekdays   = ["Wed", "Thu", "Fri"]
return_weekdays   = ["Sun", "Mon", "Tue"]
min_trip_days     = 4              # counted inclusively: Fri->Sun = 3 days
max_trip_days     = 5
min_days_out      = 3              # skip trips leaving sooner than this

[party]
adults            = 2              # total = per-person fare x adults (+ bags)
carry_on_each_way = false          # true = add one carry-on per person, each direction

# Max round-trip fare PER PERSON (base fare, both directions). Trips above this
# are hidden in the grid. Also adjustable on the web page without a re-run.
max_price_per_person = 200

# Carry-on fee per person, per direction, by airline code (USD).
# Only used when carry_on_each_way = true.
[bag_fees]
AA = 0     # American
DL = 0     # Delta
UA = 0     # United
WN = 0     # Southwest
# G4 = 0   # Allegiant  <- fill in if you turn bags on
# F9 = 0   # Frontier   <- fill in if you turn bags on

[data]
# Providers are tried in order for each lookup.
#  "google_flights" = free, unlimited, unofficial (fast-flights library).
#  "ignav"          = official API, 1,000 free requests, needs IGNAV_API_KEY.
#  "mock"           = fake prices, for testing the site only.
providers                = ["google_flights", "ignav"]
max_lookups_per_run      = 1200   # cap per refresh. Leftovers roll to the next run.
max_paid_lookups_per_run = 50    # cap for "ignav" specifically
max_minutes_per_run      = 50    # stop looking up after this, then save + publish
pause_seconds            = 1.5   # be polite between lookups

# How long a price stays "Live" before it is re-checked.
fresh_days_near  = 14    # trips within near_window_days
fresh_days_far   = 30
near_window_days = 60

# Auto-skip: if a route has had NO nonstop on a weekday this many times and
# never had a fare that weekday, stop checking it (re-tested monthly).
learn_no_flight_after = 3
[roundtrip]
max_lookups_per_run = 300
