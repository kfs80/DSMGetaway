# =====================================================================
#  DSM Weekend Getaway Finder - settings
#  Edit this file, commit it, and the next run uses the new values.
# =====================================================================

origin = "DSM"

[trip]
lookahead_days    = 240            # 8-month outlook (includes Jun 2027 Alaska launch). Change to 90, 270, etc.
depart_weekdays   = ["Wed", "Thu", "Fri"]
return_weekdays   = ["Sun", "Mon", "Tue"]
min_trip_days     = 4              # counted inclusively: Fri->Sun = 3 days
max_trip_days     = 5
min_days_out      = 3              # skip trips leaving sooner than this

[party]
adults            = 2              # total = per-person fare x adults (+ bags)
carry_on_each_way = false          # true = add one carry-on per person, each direction

# Max round-trip fare PER PERSON (base fare, both directions). Trips above this
# are hidden in the grid. Also adjustable on the web page without a re-run.
max_price_per_person = 200

# Carry-on fee per person, per direction, by airline code (USD).
# Only used when carry_on_each_way = true.
[bag_fees]
AA = 0     # American
AS = 0     # Alaska
DL = 0     # Delta
UA = 0     # United
WN = 0     # Southwest
# G4 = 0   # Allegiant  <- fill in if you turn bags on
# F9 = 0   # Frontier   <- fill in if you turn bags on

[data]
# Providers are tried in order across batch calendar + precision fallback passes.
#  "google_flights"   = free, keyless Google Flights (CalendarGraph + tfs single-date + RT).
#  "allegiant_direct" = free, keyless direct Allegiant (G4) calendar adapter (circuit-breaker protected).
#  "frontier_direct"  = free, keyless direct Frontier (F9) calendar adapter (circuit-breaker protected).
#  "travelpayouts"    = permanently free cached monthly API (needs TRAVELPAYOUTS_TOKEN).
#  "ignav"            = official API, 1,000 free requests (needs IGNAV_API_KEY).
#  "serpapi"          = Google Flights JSON API free monthly tier (needs SERPAPI_API_KEY).
#  "mock"             = fake prices, for offline testing only.
providers                = ["google_flights", "allegiant_direct", "frontier_direct", "travelpayouts", "ignav", "serpapi"]
max_lookups_per_run      = 1200   # cap per refresh. Leftovers roll to the next run.
max_paid_lookups_per_run = 50    # legacy alias for ignav per-run cap
max_minutes_per_run      = 50    # stop looking up after this, then save + publish
pause_seconds            = 1.5   # polite base pause between lookups (randomized jitter applied)
auto_refresh_hours       = 0     # set > 0 (e.g. 12 or 24) to enable in-app background refresh timer

# How long a price stays "Live" before it is re-checked.
fresh_days_near  = 5    # trips within near_window_days
fresh_days_far   = 30
near_window_days = 60

# Auto-skip: if a route has had NO nonstop on a weekday this many times and
# never had a fare that weekday, stop checking it (re-tested monthly).
learn_no_flight_after = 3

[roundtrip]
max_lookups_per_run = 300
expand_if_pp_under = 125

# Strict $0 budget guardrails for free-tier API providers
[provider_budgets]
travelpayouts_per_run = 80
travelpayouts_monthly = 5000
ignav_per_run         = 50
ignav_monthly         = 250
serpapi_per_run       = 10
serpapi_monthly       = 80

# Optional: set your GitHub Pages URL here (or in the header sync menu) to compare
# workspace builds against your live GitHub Pages deployment.
[deploy]
# github_pages_url = "https://<username>.github.io/<repo>/"

