name: Refresh fares

on:
  schedule:
    - cron: "0 11 * * 1"      # Mondays ~6 AM Central. Edit to change cadence.
  workflow_dispatch:           # "Run workflow" button = on-demand refresh
    inputs:
      mode:
        description: "refresh | build-only | mock"
        default: "refresh"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: { group: refresh, cancel-in-progress: false }

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Look up fares and build site
        timeout-minutes: 70
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'refresh' }}"
          if [ "$MODE" = "build-only" ]; then python src/refresh.py --build-only
          elif [ "$MODE" = "mock" ]; then python src/refresh.py --mock
          else python src/refresh.py; fi

      # Safety net: if the lookup step failed or timed out, still build the
      # site from whatever prices were saved so nothing is lost.
      - name: Rebuild site from saved prices (only if lookup step failed)
        if: failure() || cancelled()
        run: python src/refresh.py --build-only

      - name: Save fare cache
        if: always()
        run: |
          git config user.name  "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          [ -f data/fares.json ] && git add data/fares.json
          git diff --cached --quiet || git commit -m "Fare refresh $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with: { path: public }

  deploy:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
