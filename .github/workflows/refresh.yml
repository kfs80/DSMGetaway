name: Refresh fares

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "src/**"
      - "routes.csv"
      - "config.toml"
      - "package.json"
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: "0 11 * * *"      # Daily ~6 AM Central. Edit to change cadence.
  workflow_dispatch:           # "Run workflow" button = on-demand refresh
    inputs:
      mode:
        description: "incremental | g4 | build-only | mock"
        default: "incremental"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: { group: refresh, cancel-in-progress: false }

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund

      - name: Look up fares and build site
        timeout-minutes: 70
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node src/refresh.js --build-only
          else
            MODE="${{ github.event.inputs.mode || 'incremental' }}"
            if [ "$MODE" = "build-only" ]; then node src/refresh.js --build-only
            elif [ "$MODE" = "mock" ]; then node src/refresh.js --mock
            elif [ "$MODE" = "g4" ]; then node src/refresh.js --mode=g4
            else node src/refresh.js --mode=incremental; fi
          fi

      # Safety net: if the lookup step failed or timed out, still build the
      # site from whatever prices were saved so nothing is lost.
      - name: Rebuild site from saved prices (only if lookup step failed)
        if: failure() || cancelled()
        run: node src/refresh.js --build-only

      - name: Save fare cache and provider health
        if: always() && github.event_name != 'push'
        run: |
          git config user.name  "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          [ -f data/fares.json ] && git add data/fares.json
          [ -f data/provider_health.json ] && git add data/provider_health.json
          git diff --cached --quiet || git commit -m "Fare refresh $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with: { path: public }

  deploy:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
