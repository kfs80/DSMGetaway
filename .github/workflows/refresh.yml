name: Refresh fares

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "src/**"
      - "routes.csv"
      - "config.toml"
      - "data/fares.json"
      - "package.json"
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: "0 11 * * *"      # Daily ~6 AM Central. Edit to change cadence.
  workflow_dispatch:           # "Run workflow" button = on-demand refresh
    inputs:
      mode:
        description: "incremental | g4 | build-only | mock"
        default: "incremental"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: { group: refresh, cancel-in-progress: false }

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund

      - name: Look up fares and build site
        timeout-minutes: 70
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node src/refresh.js --build-only
          else
            MODE="${{ github.event.inputs.mode || 'incremental' }}"
            if [ "$MODE" = "build-only" ]; then node src/refresh.js --build-only
            elif [ "$MODE" = "mock" ]; then node src/refresh.js --mock
            elif [ "$MODE" = "g4" ]; then node src/refresh.js --mode=g4
            else node src/refresh.js --mode=incremental; fi
          fi

      # Safety net: if the lookup step failed or timed out, still build the
      # site from whatever prices were saved so nothing is lost.
      - name: Rebuild site from saved prices (only if lookup step failed)
        if: failure() || cancelled()
        run: node src/refresh.js --build-only

      # Upload the freshly built site BEFORE rebasing/cleaning working tree files.
      - uses: actions/upload-pages-artifact@v5
        if: always()
        with: { path: public }

      - name: Save fare cache and provider health
        if: always() && github.event_name != 'push'
        run: |
          git config user.name  "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          if [ -f data/fares.json ]; then git add data/fares.json; fi
          if [ -f data/provider_health.json ]; then git add data/provider_health.json; fi
          if git diff --cached --quiet; then
            echo "No fare cache changes to commit."
            exit 0
          fi
          git commit -m "Fare refresh $(date -u +%F)"
          # Clear unstaged generated outputs (already uploaded above) so git rebase stays clean.
          git checkout -- .
          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push attempt $attempt conflicted; retrying..."
            sleep 3
          done
          echo "Failed to push after 3 attempts" >&2
          exit 1

  deploy:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v5
